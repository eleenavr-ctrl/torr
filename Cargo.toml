[package]
name = "torrserver-ui"
version = "0.2.0"
edition = "2021"
authors = ["TorrServerUI Contributors"]
description = "Portable modular Windows 11 Fluent UI shell and launcher for TorrServer"
license = "MIT"
build = "build.rs"

[lib]
name = "torrserver_ui"
path = "src/lib.rs"

[[bin]]
name = "torrserver-ui"
path = "src/main.rs"

[dependencies]
slint = { version = "~1.9", features = ["raw-window-handle-06", "backend-winit", "renderer-femtovg", "renderer-software"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "cookies", "socks"] }
encoding_rs = "0.8"
tray-icon = "0.19"
arboard = "3.4"
rfd = "0.15"
chrono = "0.4"
raw-window-handle = "0.6"
urlencoding = "2.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
interprocess = "2.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"

[target.'cfg(windows)'.dependencies]
wry = { version = "0.50", default-features = false, features = ["os-webview"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "~1.9"
embed-resource = "3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = true
