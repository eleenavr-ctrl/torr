[package]
name = "torrserver-ui"
version = "0.1.0"
edition = "2021"
authors = ["TorrServerUI Contributors"]
description = "Portable modular Windows 11 Fluent UI shell and launcher for TorrServer"

[dependencies]
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
tray-icon = "0.19"
arboard = "3.4"
rfd = "0.15"
chrono = "0.4"
raw-window-handle = "0.6"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
